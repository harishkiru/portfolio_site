spring.application.name=harish-portfolio
server.port=${PORT:8080}
spring.config.import=optional:file:./lastfm.local.properties,optional:file:./server/lastfm.local.properties
lastfm.username=${LASTFM_USERNAME:McGodFTW}
lastfm.api-key=${LASTFM_API_KEY:}
server.error.include-message=never
server.error.include-stacktrace=never
gallery.directory=${GALLERY_DIRECTORY:./gallery-data}
owner.username=${OWNER_USERNAME:harish}
owner.password=${OWNER_PASSWORD:}
owner.credentials-file=${OWNER_CREDENTIALS_FILE:./owner-credentials.local.properties}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
sharex.host=${SHAREX_HOST:img.harishkiru.dev}
sharex.upload-token=${SHAREX_UPLOAD_TOKEN:}
sharex.capacity-bytes=${SHAREX_CAPACITY_BYTES:10000000000}
r2.account-id=${R2_ACCOUNT_ID:}
r2.bucket=${R2_BUCKET:}
r2.access-key-id=${R2_ACCESS_KEY_ID:}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
