name: harish-portfolio
services:
  portfolio:
    image: harish-portfolio:${IMAGE_TAG:-local}
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      OWNER_USERNAME: ${OWNER_USERNAME:-harish}
      LASTFM_USERNAME: ${LASTFM_USERNAME:-McGodFTW}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      GALLERY_DIRECTORY: /data/gallery
      SHAREX_HOST: ${SHAREX_HOST:-img.harishkiru.dev}
      SHAREX_CAPACITY_BYTES: ${SHAREX_CAPACITY_BYTES:-10000000000}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET: ${R2_BUCKET:-}
    secrets:
      - source: owner_password
        target: owner.password
      - source: lastfm_api_key
        target: lastfm.api-key
      - source: sharex_upload_token
        target: sharex.upload-token
      - source: r2_access_key_id
        target: r2.access-key-id
      - source: r2_secret_access_key
        target: r2.secret-access-key
    volumes:
      - gallery:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1.0
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
secrets:
  owner_password:
    file: ./secrets/owner.password
  lastfm_api_key:
    file: ./secrets/lastfm.api-key
  sharex_upload_token:
    file: ./secrets/sharex.upload-token
  r2_access_key_id:
    file: ./secrets/r2.access-key-id
  r2_secret_access_key:
    file: ./secrets/r2.secret-access-key
volumes:
  gallery:
    name: harish-portfolio-gallery
